<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-labelledby="title desc">
  <title id="title">HomeLake</title>
  <desc id="desc">A roof above three stacked lake layers: gold, silver and bronze.</desc>
  <defs>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4C7DFF"/>
      <stop offset="1" stop-color="#2440B3"/>
    </linearGradient>
  </defs>

  <g transform="translate(0 -5)">
    <!-- Bronze layer (raw) -->
    <path d="M50 148 L100 172 V182 L50 158 Z" fill="#A85A2A"/>
    <path d="M150 148 L100 172 V182 L150 158 Z" fill="#8E4A22"/>
    <path d="M100 124 L150 148 L100 172 L50 148 Z" fill="#D98A4E"/>

    <!-- Silver layer (cleaned) -->
    <path d="M50 122 L100 146 V156 L50 132 Z" fill="#AAB7C5"/>
    <path d="M150 122 L100 146 V156 L150 132 Z" fill="#8F9DAD"/>
    <path d="M100 98 L150 122 L100 146 L50 122 Z" fill="#E6ECF2"/>

    <!-- Gold layer (business-ready) -->
    <path d="M50 96 L100 120 V130 L50 106 Z" fill="#D99A25"/>
    <path d="M150 96 L100 120 V130 L150 106 Z" fill="#BD821B"/>
    <path d="M100 72 L150 96 L100 120 L50 96 Z" fill="#F8C95A"/>

    <!-- Roof -->
    <path d="M50 74 L100 34 L150 74" fill="none" stroke="url(#roof)" stroke-width="13"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
