# Common Spark defaults for all Spark containers.
# Values that differ by service are supplied by docker-compose.yml.

spark.master                                      spark://spark-master:7077
spark.executor.cores                              2
spark.executor.memory                             768m
spark.driver.memory                               768m

spark.sql.extensions                              io.delta.sql.DeltaSparkSessionExtension
spark.sql.catalog.spark_catalog                   org.apache.spark.sql.delta.catalog.DeltaCatalog
spark.sql.catalogImplementation                   hive
spark.sql.warehouse.dir                           file:/opt/data/warehouse

spark.eventLog.enabled                            true
spark.eventLog.dir                                file:/opt/data/spark-events
spark.history.fs.logDirectory                     file:/opt/data/spark-events

spark.sql.adaptive.enabled                        true
spark.sql.shuffle.partitions                      8
