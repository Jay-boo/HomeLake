name: dataplatform_jayboo

services:
  spark-master:
    image: dtp-spark:${SPARK_VERSION:-4.0.1}
    build:
      context: ./spark
      dockerfile: Dockerfile
      args:
        SPARK_VERSION: ${SPARK_VERSION:-4.0.1}
        DELTA_VERSION: ${DELTA_VERSION:-4.0.0}
    container_name: dtp-spark-master
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master"]
    environment:
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - ../data:/opt/data
    networks: [bdp]

  spark-worker-1:
    image: dtp-spark:${SPARK_VERSION:-4.0.1}
    container_name: dtp-spark-worker-1
    hostname: spark-worker-1
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_CORES: ${WORKER_CORES:-2}
      SPARK_WORKER_MEMORY: ${WORKER_MEMORY:-768m}
      SPARK_NO_DAEMONIZE: "true"
    depends_on: [spark-master]
    ports:
      - "8081:8081"
    volumes:
      - ../data:/opt/data
    networks: [bdp]

  spark-worker-2:
    image: dtp-spark:${SPARK_VERSION:-4.0.1}
    container_name: dtp-spark-worker-2
    hostname: spark-worker-2
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      SPARK_WORKER_CORES: ${WORKER_CORES:-2}
      SPARK_WORKER_MEMORY: ${WORKER_MEMORY:-768m}
      SPARK_NO_DAEMONIZE: "true"
    depends_on: [spark-master]
    ports:
      - "8082:8081"
    volumes:
      - ../data:/opt/data
    networks: [bdp]

  spark-connect:
    image: dtp-spark:${SPARK_VERSION:-4.0.1}
    container_name: dtp-spark-connect
    hostname: spark-connect
    command:
      - /opt/spark/sbin/start-connect-server.sh
      - --master
      - spark://spark-master:7077
      - --packages
      - ""
      - --conf
      - spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension
      - --conf
      - spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog
      - --conf
      - spark.driver.host=spark-connect
      - --conf
      - spark.driver.bindAddress=0.0.0.0
      - --conf
      - spark.connect.grpc.binding.port=15002
      - --conf
      - spark.cores.max=1
      - --conf
      - spark.executor.cores=1
      - --conf
      - spark.executor.memory=512m
    environment:
      SPARK_NO_DAEMONIZE: "true"
      POSTGRES_USER: ${POSTGRES_USER:-homelake}
      POSTGRES_DB: ${POSTGRES_DB:-metastore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    depends_on: [spark-master, spark-worker-1, spark-worker-2]
    ports:
      - "15002:15002"
      - "4040:4040"
    volumes:
      - ../data:/opt/data
    networks: [bdp]

  spark-history:
    image: dtp-spark:${SPARK_VERSION:-4.0.1}
    container_name: dtp-spark-history
    hostname: spark-history
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.history.HistoryServer"]
    environment:
      SPARK_NO_DAEMONIZE: "true"
    ports:
      - "18080:18080"
    volumes:
      - ../data:/opt/data
    depends_on: [spark-master]
    networks: [bdp]

  # Short-lived container used for independent spark-submit applications.
  # Start it on demand with: docker compose run --rm submit ...
  submit:
    image: dtp-spark:${SPARK_VERSION:-4.0.1}
    profiles: ["job"]
    container_name: dtp-spark-submit
    entrypoint: ["/usr/bin/tini", "--", "/usr/local/bin/entrypoint.sh", "spark-submit"]
    environment:
      SPARK_NO_DAEMONIZE: "true"
      POSTGRES_USER: ${POSTGRES_USER:-homelake}
      POSTGRES_DB: ${POSTGRES_DB:-metastore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - ../data:/opt/data
      - ../:/opt/project:ro
    working_dir: /opt/project
    networks: [bdp]
  
  postgres:
    image: postgres:${POSTGES_VERSION:-16}
    container_name: homelake-postgres
    hostname: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-metastore}
      POSTGRES_USER: ${POSTGRES_USER:-homelake}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-homelake} -d ${POSTGRES_DB:-metastore}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [bdp]

networks:
  bdp:
    name: bdp-network
    driver: bridge

volumes:
  postgres-data:
    name: homelake-postgres-data